# golden-census's checker stance: default
# (non-strict) checking against the documented interpreter floor, plus
# check_untyped_defs — without it mypy skips the bodies of unannotated
# functions, and a program whose bodies are unchecked is a floor with a hole
# in it. NOT --strict: strict buries the real signal under annotation-coverage
# demands. Checker output produced under any other configuration is not a bug
# report.
#
# `files` is a glob, not the directory: given a directory, mypy silently skips
# a module whose name collides with a sibling directory holding `.py` files,
# and reports success on the rest. Named one by one, every file is checked.
# Run bare `mypy` — an argument replaces this list and brings the skip back.
[mypy]
files = golden_census/**/*.py
python_version = 3.11
check_untyped_defs = True
